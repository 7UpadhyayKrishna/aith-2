# Railway service config for AITH FastAPI backend.
# Root directory for deploy should be backend/ (railway up .\backend --path-as-root).

[build]
builder = "RAILPACK"

[deploy]
startCommand = "uvicorn server:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
